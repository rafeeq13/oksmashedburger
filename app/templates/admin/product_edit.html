{% extends "admin/base.html" %}
{% block title %}Edit {{ product.name }}, {{ brand_name }}{% endblock %}

{% block admin %}
<div class="mb-5 flex items-center justify-between gap-3">
  <a href="/admin/menu{{ qs }}" class="link-underline text-sm"><i class="fa-solid fa-arrow-left"></i> Back to menu</a>
  <a href="/admin/menu/{{ product.id }}/modifiers{{ qs }}" class="btn btn-secondary btn-sm"><i class="fa-solid fa-sliders"></i> Sizes &amp; add-ons</a>
</div>

<h2 class="ok-h2 mb-5">Edit item</h2>

<div class="grid lg:grid-cols-[220px_1fr] gap-6 items-start">
  <div class="ok-card p-4">
    <img src="{{ product.image_url or url_for('static', filename='img/logo.png') }}" onerror="this.onerror=null;this.src='{{ url_for('static', filename='img/logo.png') }}'" alt="{{ product.name }}" class="w-full aspect-square object-cover rounded-lg bg-softyellow mb-2">
    <p class="text-xs text-slate break-all">{{ product.image_url or 'No image set, a placeholder shows.' }}</p>
  </div>

  <form method="post" action="/admin/menu/{{ product.id }}/edit{{ qs }}" enctype="multipart/form-data" class="ok-card p-5 grid sm:grid-cols-2 gap-3">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <div class="sm:col-span-2"><label class="ok-label !text-xs">Name</label><input name="name" value="{{ product.name }}" required class="ok-input py-2 text-sm"></div>
    <div><label class="ok-label !text-xs">Category</label>
      <select name="category_id" class="ok-select py-2 text-sm">{% for c in categories %}<option value="{{ c.id }}" {% if c.id == product.category_id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
    <div><label class="ok-label !text-xs">Base price ($)</label><input name="base_price" type="number" step="0.01" min="0" value="{{ '%.2f'|format(product.base_price) }}" class="ok-input py-2 text-sm"></div>
    <div class="sm:col-span-2"><label class="ok-label !text-xs">Description</label><textarea name="description" rows="2" class="ok-textarea text-sm">{{ product.description or '' }}</textarea></div>
    <div><label class="ok-label !text-xs">Image URL</label><input name="image_url" value="{{ product.image_url or '' }}" class="ok-input py-2 text-sm" placeholder="https://…"></div>
    <div><label class="ok-label !text-xs">…or upload new photo</label><input name="image_file" type="file" accept="image/*" class="ok-input py-1.5 text-sm"></div>
    <div><label class="ok-label !text-xs">Calories</label><input name="calories" type="number" value="{{ product.calories or '' }}" class="ok-input py-2 text-sm"></div>
    <div><label class="ok-label !text-xs">Sort order</label><input name="sort_order" type="number" value="{{ product.sort_order }}" class="ok-input py-2 text-sm"></div>
    <div><label class="ok-label !text-xs">Allergens (comma)</label><input name="allergens" value="{{ (product.allergens or [])|join(', ') }}" class="ok-input py-2 text-sm"></div>
    <div><label class="ok-label !text-xs">Tags (comma)</label><input name="tags" value="{{ (product.tags or [])|join(', ') }}" class="ok-input py-2 text-sm"></div>
    <label class="flex items-center gap-2 text-sm mt-1"><input type="checkbox" name="is_vegan" {% if product.is_vegan %}checked{% endif %} class="w-4 h-4 accent-okyellow"> Vegan</label>
    <label class="flex items-center gap-2 text-sm mt-1"><input type="checkbox" name="is_active" {% if product.is_active %}checked{% endif %} class="w-4 h-4 accent-okyellow"> Active (visible on menus)</label>
    <div class="sm:col-span-2 pt-3 border-t border-[var(--ok-line)]"><button class="btn btn-primary btn-sm">Save changes</button></div>
  </form>
</div>

<form method="post" action="/admin/menu/{{ product.id }}/delete{{ qs }}" onsubmit="return confirm('Delete {{ product.name }}? (It is archived instead if it has order history.)')" class="mt-4">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <button class="link-underline text-sm !text-okred"><i class="fa-solid fa-trash"></i> Delete this item</button>
</form>
{% endblock %}
