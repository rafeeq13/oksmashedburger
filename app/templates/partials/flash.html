{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div id="ok-flash" class="ok-flash">
  {% for cat, msg in messages %}
  <div class="w-100 ok-card ok-px-3 ok-py-3 d-flex align-items-center ok-gap-3 ok-shadow-xl {% if cat == 'error' %}border-ok-red{% elif cat == 'success' %}border-ok-green{% endif %}">
    <i class="fa-solid {% if cat == 'error' %}fa-circle-exclamation text-ok-red{% elif cat == 'success' %}fa-circle-check text-ok-green{% else %}fa-circle-info text-gold{% endif %}"></i>
    <span class="ok-fs-sm fw-medium">{{ msg }}</span>
  </div>
  {% endfor %}
</div>
<script>setTimeout(function(){var f=document.getElementById('ok-flash');if(f){f.style.transition='opacity .4s';f.style.opacity='0';setTimeout(function(){f.remove();},400);}},4500);</script>
{% endif %}
{% endwith %}
