<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unavailable</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.c{max-width:520px}
h1{font-size:28px;margin-bottom:16px;font-weight:700}
p{font-size:16px;color:#aaa;line-height:1.7;margin-bottom:32px}
.b{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:8px 20px;font-size:13px;color:#ccc;font-weight:600}
.d{width:8px;height:8px;border-radius:50%;background:#ccc;animation:p 1.5s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="c">
<h1>Sorry, we are unavailable</h1>
<p>This site is temporarily offline. Please check back again soon.</p>
</div>
</body>
</html>
