# Temporary HTTP-only config for ACME + app (before SSL on new domain)
server {
    listen 80;
    listen [::]:80;
    server_name oksmashedburger.com www.oksmashedburger.com;

    client_max_body_size 200M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location /static/img/uploads/ {
        alias /var/www/oksmashedburger/app/static/img/uploads/;
    }

    location /static/ {
        alias /var/www/oksmashedburger/app/static/;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
