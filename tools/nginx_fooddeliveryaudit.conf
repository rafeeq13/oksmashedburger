# fooddeliveryaudit.com — disconnected from eggok (no proxy)
server {
    listen 80;
    listen [::]:80;
    server_name fooddeliveryaudit.com www.fooddeliveryaudit.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fooddeliveryaudit.com www.fooddeliveryaudit.com;
    ssl_certificate /etc/letsencrypt/live/fooddeliveryaudit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fooddeliveryaudit.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    error_page 503 @unavailable;
    location @unavailable {
        root /var/www;
        rewrite ^ /maintenance.html break;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        return 503;
    }
}
