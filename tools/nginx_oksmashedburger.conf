# OK Smashed Burger — oksmashedburger.com (production)

server {
    server_name oksmashedburger.com www.oksmashedburger.com;

    client_max_body_size 200M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    location /static/img/uploads/ {
        alias /var/www/oksmashedburger/app/static/img/uploads/;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        access_log off;
    }

    location /static/ {
        alias /var/www/oksmashedburger/app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/www.oksmashedburger.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.oksmashedburger.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name oksmashedburger.com www.oksmashedburger.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    return 301 https://$host$request_uri;
}
