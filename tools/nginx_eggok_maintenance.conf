# eggsokpa.com — maintenance mode (restore from eggok.live when done)
server {
    listen 80;
    server_name eggsokpa.com www.eggsokpa.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name eggsokpa.com www.eggsokpa.com;
    ssl_certificate /etc/letsencrypt/live/eggsokpa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eggsokpa.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    error_page 503 @maintenance;
    location @maintenance {
        root /var/www;
        rewrite ^ /maintenance.html break;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After 3600 always;
    }

    location / {
        return 503;
    }
}
